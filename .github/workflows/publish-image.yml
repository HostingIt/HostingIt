name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # QEMU needed so ubuntu-latest (amd64) can also build linux/arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve public build args
        id: args
        run: |
          echo "app_url=${NEXT_PUBLIC_APP_URL:-https://hostingit.online}" >> "$GITHUB_OUTPUT"
          echo "base_domain=${NEXT_PUBLIC_BASE_DOMAIN:-hostingit.online}" >> "$GITHUB_OUTPUT"
          echo "prefix=${NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX:-fhusr}" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BASE_DOMAIN: ${{ vars.NEXT_PUBLIC_BASE_DOMAIN }}
          NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX: ${{ vars.NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Dokploy hosts may be amd64 or arm64 (e.g. Ampere / Graviton)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ steps.args.outputs.app_url }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ steps.args.outputs.base_domain }}
            NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX=${{ steps.args.outputs.prefix }}
