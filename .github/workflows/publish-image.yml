name: Publish image

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build-and-push:
    # Native ARM — matches Dokploy host; avoids slow QEMU multi-arch builds
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve public build args
        id: args
        run: |
          echo "app_url=${NEXT_PUBLIC_APP_URL:-https://hostingit.online}" >> "$GITHUB_OUTPUT"
          echo "base_domain=${NEXT_PUBLIC_BASE_DOMAIN:-hostingit.online}" >> "$GITHUB_OUTPUT"
          echo "prefix=${NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX:-fhusr}" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BASE_DOMAIN: ${{ vars.NEXT_PUBLIC_BASE_DOMAIN }}
          NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX: ${{ vars.NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ steps.args.outputs.app_url }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ steps.args.outputs.base_domain }}
            NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX=${{ steps.args.outputs.prefix }}

  # Dokploy Autodeploy only works for git-based sources, not Docker images.
  # This job pings the Dokploy API to redeploy the staging panel after :next is pushed.
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl -fsSL -X POST \
            "${{ secrets.DOKPLOY_API_URL }}/api/application.redeploy" \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"${{ secrets.STAGING_DOKPLOY_APP_ID }}"}'
