# Optional local/prod stack: panel + Postgres.
# On Dokploy, prefer a managed Postgres service + Docker image deploy instead.
#
#   export POSTGRES_PASSWORD=... AUTH_SECRET=... NEXT_PUBLIC_APP_URL=https://...
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostingit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hostingit
    volumes:
      - hostingit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostingit -d hostingit"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${HOSTINGIT_IMAGE:-ghcr.io/hostingit/hostingit:latest} # or ghcr.io/<owner>/<repo>:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://hostingit:${POSTGRES_PASSWORD}@postgres:5432/hostingit
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-hostingit.online}
      NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX: ${NEXT_PUBLIC_FREE_SUBDOMAIN_PREFIX:-fhusr}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      DOKPLOY_API_URL: ${DOKPLOY_API_URL}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      PAYMENT_UPI_ID: ${PAYMENT_UPI_ID:-}
      PAYMENT_PAYPAL: ${PAYMENT_PAYPAL:-}
      PAYMENT_BANK_DETAILS: ${PAYMENT_BANK_DETAILS:-}

volumes:
  hostingit_pg:
